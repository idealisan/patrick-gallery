name: Release build & publish

# Triggers
#   * push of a tag (git push origin v1.5.0-go)  -> run CI, then publish
#   * a published GitHub Release                  -> same pipeline (kept so the
#     "draft notes -> publish" flow still works)
#
# `github.ref_name` is the tag for BOTH events (a release event's ref is the
# tag), so every step below is event-agnostic.
#
# Pipeline (nothing is published unless CI is green):
#   1. CI: `go vet` + `go test` and the Schemathesis API-contract regression
#      gate (same checks as .github/workflows/ci.yml).
#   2. Publish 6 cross-compiled binaries, attached as assets of the GitHub
#      Release for the tag.
#   3. Publish a multi-arch Docker image (linux/amd64 + linux/arm64) to
#      ghcr.io/<owner>/<repo>, tagged :latest and :<tag>.
#
# Timeout strategy (to avoid hung jobs wasting Actions minutes):
#   * every job has `timeout-minutes`
#   * the test steps have explicit `-timeout`
#   * the build matrix uses `fail-fast: true`.

on:
  push:
    tags: ['**']
  release:
    types: [published]

permissions:
  contents: write   # required to create the Release / upload release assets
  packages: write   # required to push the Docker image to GHCR

# Never let two tag pipelines fight over :latest / the same Release.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  test:
    name: Test & vet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        timeout-minutes: 5
        # internal/video uses intentional unsafe.Pointer FFI (purego-loaded
        # FFmpeg); go vet flags that as "possible misuse" but it is required
        # for the in-process video backend, so vet everything except it.
        run: go vet $(go list ./... | grep -v '/internal/video')

      - name: Test
        timeout-minutes: 10
        run: go test -timeout 300s ./...

  contract-test:
    name: API contract regression (Schemathesis)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Schemathesis
        run: python3 -m pip install --quiet "schemathesis==4.27.5" "hypothesis==6.168.0"

      - name: Run contract regression gate
        # Builds immich-go, starts it, logs in, runs Schemathesis against the
        # official Immich v3.1.0 OpenAPI spec, and fails on DTO-shape regressions.
        run: python3 scripts/schemathesis_check.py --max-examples 1

      - name: Upload report on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schemathesis-regression-${{ github.ref_name }}
          path: reports/schemathesis/regression
          if-no-files-found: ignore

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: [test, contract-test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Stop the whole matrix on the first failure (saves minutes when the
    # code doesn't compile for one platform — it won't for any of them).
    strategy:
      fail-fast: true
      matrix:
        include:
          - { goos: linux,   goarch: arm64 }
          - { goos: linux,   goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build (CGO_ENABLED=0, pure-Go SQLite)
        timeout-minutes: 15
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          BIN="immich-go-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then BIN="${BIN}.exe"; fi
          go build -trimpath -ldflags="-s -w" -o "${BIN}" .

      - name: Bundle FFmpeg shared libs
        timeout-minutes: 10
        run: bash scripts/bundle-deps.sh .

      # Keep the packages as workflow artifacts too (handy for debugging a
      # tag whose Release asset upload failed).
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: immich-go-${{ matrix.goos }}-${{ matrix.goarch }}
          path: immich-go-*
          if-no-files-found: error
          retention-days: 14

      - name: Attach to GitHub Release
        # Creates the Release for the tag if it does not exist yet, then
        # attaches the package (binaries + bundled FFmpeg libs).
        uses: softprops/action-gh-release@v2
        with:
          files: immich-go-*

  docker:
    name: Docker image (multi-arch)
    needs: [test, contract-test]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        # Enables building linux/arm64 on the amd64 runner via emulation.
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tag
        # Docker tags cannot contain "/" while git tags can; sanitize so a tag
        # like `release/1.0` still publishes (as `release-1.0`).
        id: tag
        run: echo "value=$(printf '%s' "${GITHUB_REF_NAME}" | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        # Multi-arch: linux/amd64 (native) + linux/arm64 (QEMU-emulated).
        # Public GHCR packages are free; build cache via GHA keeps minutes low.
        # Hard timeout protects against a slow emulated build hanging.
        timeout-minutes: 35
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  notify-lark:
    name: Notify Lark (build result)
    # Report the overall tag-pipeline outcome (CI + matrix + docker) to a
    # Lark (Feishu) group bot. The webhook URL comes from the repo secret
    # LARK_WEBHOOK_URL; if unset the step skips so the release still proceeds.
    needs: [test, contract-test, build, docker]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Post build result to Lark
        env:
          LARK_WEBHOOK_URL: ${{ secrets.LARK_WEBHOOK_URL }}
          R_TEST: ${{ needs.test.result }}
          R_CONTRACT: ${{ needs.contract-test.result }}
          R_BUILD: ${{ needs.build.result }}
          R_DOCKER: ${{ needs.docker.result }}
        run: |
          if [ -z "$LARK_WEBHOOK_URL" ]; then
            echo "LARK_WEBHOOK_URL secret not set; skipping Lark notification"
            exit 0
          fi
          STATUS="success"
          for r in "$R_TEST" "$R_CONTRACT" "$R_BUILD" "$R_DOCKER"; do
            [ "$r" = "success" ] || STATUS="$r"
          done
          if [ "$STATUS" = "success" ]; then ICON="✅"; else ICON="❌"; fi
          TAG="${GITHUB_REF_NAME}"
          MSG="${ICON} immich-go release build: ${STATUS} (${TAG})
          repo:   ${GITHUB_REPOSITORY}
          commit: ${GITHUB_SHA::7}
          actor:  ${GITHUB_ACTOR}
          run:    ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          PAYLOAD=$(python3 -c 'import json,sys; print(json.dumps({"msg_type":"text","content":{"text":sys.argv[1]}}))' "$MSG")
          curl -sS -X POST "$LARK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            --data-binary "$PAYLOAD"
