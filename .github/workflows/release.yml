name: Release build & test

# Runs on every published GitHub Release. Tests the code, then cross-compiles
# the 6 platform binaries and attaches them as release assets.
#
# Timeout strategy (to avoid hung jobs wasting Actions minutes):
#   * every job has `timeout-minutes`
#   * the test step has an explicit `go test -timeout`
#   * the build matrix uses `fail-fast: true` so a common compile failure
#     stops the other platforms instead of building them all.

on:
  release:
    types: [published]

permissions:
  contents: write   # required to upload release assets
  packages: write   # required to push the Docker image to GHCR

jobs:
  test:
    name: Test & vet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        timeout-minutes: 5
        run: go vet ./...

      - name: Test
        timeout-minutes: 10
        run: go test -timeout 300s ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Stop the whole matrix on the first failure (saves minutes when the
    # code doesn't compile for one platform — it won't for any of them).
    strategy:
      fail-fast: true
      matrix:
        include:
          - { goos: linux,   goarch: arm64 }
          - { goos: linux,   goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build (CGO_ENABLED=0, pure-Go SQLite)
        timeout-minutes: 15
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          BIN="immich-go-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then BIN="${BIN}.exe"; fi
          go build -trimpath -ldflags="-s -w" -o "${BIN}" .

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: immich-go-*

  docker:
    name: Docker image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        # Single native arch (linux/amd64) to avoid slow QEMU emulation and
        # keep Actions minutes low. Flip to "linux/amd64,linux/arm64" (and add
        # docker/setup-qemu-action) for a multi-arch image.
        timeout-minutes: 25
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.event.release.tag_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
