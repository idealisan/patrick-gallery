<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Immich</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <!-- Login screen (shown when not authenticated) -->
  <div id="login-screen" class="login-screen" hidden>
    <div class="login-card">
      <div class="login-logo">IMMICH</div>
      <div class="login-sub muted">Self-hosted photo &amp; video backup · Go port</div>
      <form id="login-form">
        <label>Email
          <input type="text" id="email" placeholder="admin@immich.app" value="admin@immich.app" autocomplete="username" />
        </label>
        <label>Password
          <input type="password" id="pass" placeholder="password" value="password" autocomplete="current-password" />
        </label>
        <button type="submit" id="login-btn" class="btn-primary">Sign in</button>
        <div id="login-msg" class="msg"></div>
      </form>
    </div>
  </div>

  <!-- App shell -->
  <div id="app" class="app" hidden>
    <aside class="sidebar">
      <div class="brand">IMMICH</div>
      <nav class="nav">
        <a class="nav-item" data-view="photos" href="#/photos"><span class="ico">▦</span><span class="lbl">Photos</span></a>
        <a class="nav-item" data-view="albums" href="#/albums"><span class="ico">▤</span><span class="lbl">Albums</span></a>
        <a class="nav-item" data-view="search" href="#/search"><span class="ico">⌕</span><span class="lbl">Search</span></a>
        <a class="nav-item" data-view="favorites" href="#/favorites"><span class="ico">★</span><span class="lbl">Favorites</span></a>
        <a class="nav-item" data-view="archive" href="#/archive"><span class="ico">▥</span><span class="lbl">Archive</span></a>
        <a class="nav-item" data-view="trash" href="#/trash"><span class="ico">🗑</span><span class="lbl">Trash</span></a>
        <a class="nav-item" data-view="admin" href="#/admin"><span class="ico">⚙</span><span class="lbl">Admin</span></a>
      </nav>
      <div class="user-box">
        <div class="avatar" id="user-avatar">?</div>
        <div class="user-meta">
          <div class="user-name" id="user-name">—</div>
          <button class="link" id="logout-btn">Sign out</button>
        </div>
      </div>
    </aside>

    <main class="content">
      <header class="topbar">
        <h1 id="page-title">Photos</h1>
        <div class="topbar-actions">
          <input type="search" id="global-search" class="search-input" placeholder="Search photos, camera, place…" hidden />
          <button id="upload-btn" class="btn-primary">⬆ Upload</button>
        </div>
      </header>
      <section id="view" class="view"></section>
    </main>
  </div>

  <!-- Upload dropzone overlay -->
  <div id="dropzone" class="dropzone" hidden>
    <div class="dropzone-inner">
      <div class="dropzone-icon">⬇</div>
      <div>Drop photos &amp; videos to upload</div>
    </div>
  </div>

  <!-- Asset viewer / lightbox -->
  <div id="viewer" class="viewer" hidden>
    <button class="viewer-close" id="viewer-close">✕</button>
    <button class="viewer-nav prev" id="viewer-prev">‹</button>
    <button class="viewer-nav next" id="viewer-next">›</button>
    <div class="viewer-stage" id="viewer-stage"></div>
    <aside class="viewer-panel" id="viewer-panel"></aside>
  </div>

  <div id="toast" class="toast"></div>

  <script src="/assets/app.js"></script>
</body>
</html>
